# Pick a language for the bare "/" request from the browser's Accept-Language.
# French is the default (French company / primary market); English only when the
# header's first tag is en-*.
map $http_accept_language $preferred_lang {
    default   fr;
    "~*^en"   en;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: cache hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpe?g|gif|svg|webp|avif|mp4|webm|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt / sitemap.xml / i18n json: served fresh-ish, no long immutable cache.
    location ~* \.(?:json|xml|txt)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Bare root -> language home, based on Accept-Language.
    location = / {
        return 302 /$preferred_lang/;
    }

    # CSR-only routes (not prerendered): serve the language shell so Angular
    # can client-render them. Keep in sync with app.routes.ts.
    location ~ ^/(fr|en)/news/.+ {
        try_files $uri $uri/index.html /$1/index.html;
    }

    # Prerendered language trees. Unknown paths -> real 404 with the
    # prerendered not-found page as the body.
    location /fr/ {
        error_page 404 /fr/404/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }
    location /en/ {
        error_page 404 /en/404/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Anything else (no language prefix): 404 with the French not-found page.
    location / {
        error_page 404 /fr/404/index.html;
        try_files $uri $uri/index.html $uri/ =404;
    }
}
