# Pick a language for the bare "/" request from the browser's Accept-Language.
# French is the default (French company / primary market); English only when the
# header's first tag is en-*.
map $http_accept_language $preferred_lang {
    default   fr;
    "~*^en"   en;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets: cache hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpe?g|gif|svg|webp|avif|mp4|webm|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt / sitemap.xml / i18n json: served fresh-ish, no long immutable cache.
    location ~* \.(?:json|xml|txt)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Bare root -> language home, based on Accept-Language.
    location = / {
        return 302 /$preferred_lang/;
    }

    # Prerendered language trees. Unknown paths fall back to that language's
    # shell so the SPA can client-render them (e.g. /fr/news/:id).
    location /fr/ {
        try_files $uri $uri/index.html $uri/ /fr/index.html;
    }
    location /en/ {
        try_files $uri $uri/index.html $uri/ /en/index.html;
    }

    # Anything else: generic SPA shell.
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
