<app-banner [title]="'header.process' | translate" imageUrl="assets/img/banner/banner_process.webp"></app-banner>

<div class="container mt-10 lg:mt-20 mb-20 lg:mb-32">
  <div class="max-w-4xl mx-auto text-center mb-10 lg:mb-16 reveal">
    <h2 class="text-4xl lg:text-6xl mb-6" [innerHTML]="'process.title_1' | translate"></h2>
    <p class="text-justify text-xl lg:text-2xl p-light" [innerHTML]="'process.description_1' | translate"></p>
  </div>
  <div class="image-container image-container--fit mx-auto reveal">
    <img class="max-h-[500px] w-auto rounded-xl shadow" src="assets/img/img_industrial_process_1.webp" alt="Illustration procédé industriel" title="Illustration procédé industriel">
  </div>
</div>

<div class="bg-white py-16 lg:py-24 mb-20 lg:mb-32 reveal">
  <div class="container">
    <div class="grid lg:grid-cols-2 gap-10 items-center">
      <div class="shadow image-container !h-72 lg:!h-96 lg:order-2">
        <img class="w-full" src="assets/img/img_industrial_process_2.webp" alt="Illustration procédé industriel" title="Illustration procédé industriel">
      </div>
      <div class="lg:order-1">
        <h2 class="text-4xl lg:text-5xl mb-5" [innerHTML]="'process.title_2' | translate"></h2>
        <p class="text-lg lg:text-xl" [innerHTML]="'process.description_2' | translate"></p>
      </div>
    </div>
  </div>
</div>

<div class="container mb-20 lg:mb-32">
  <div class="mx-auto lg:w-8/12 bg-white shadow-sm rounded-xl p-5 lg:p-16 reveal">
    <h2 class="text-4xl lg:text-5xl mb-5" [innerHTML]="'process.title_3' | translate"></h2>
    <p class="text-justify text-lg lg:text-xl mb-8" [innerHTML]="'process.description_3' | translate"></p>
    <button class="btn btn-lg" [routerLink]="'products' | localizedLink">
      {{ 'process.see_products' | translate }}
      <fa-icon class="ms-2" [icon]="faArrowRight"></fa-icon>
    </button>
  </div>
</div>

<div class="mt-40">
  <app-carousel [items]="links"></app-carousel>
</div>
