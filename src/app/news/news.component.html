<div class="banner" appParallax [ratio]="-0.3" style="background-image: url('../../assets/img/banner/banner_news.png')">
  <h1 class="reveal">{{ 'header.news' | translate }}</h1>
</div>

<div class="container">
  <div class="relative z-1 -mt-20 mx-auto lg:w-8/12 bg-white shadow-sm rounded-xl pb-5 lg:pb-10 min-h-[500px]">
    <div class="absolute -top-14 left-0 text-white">
      <app-ariane [path]="navigationPath"></app-ariane>
    </div>
    <div class="p-5 lg:p-10">
      <h2 class="z-10 title title-start">{{ 'news.last_news' | translate }}</h2>
      <p class="mt-10">{{ 'news.news_description' | translate }}</p>
    </div>
    <div class="flex flex-col gap-16 reveal">
      @for (news of newsList; track news) {
      <div class="grid grid-cols-3">
        <div routerLink="/news/{{ news.id }}" class="image-container max-h-[180px] col-span-1 rounded-2xl bg-cyan-100 -translate-x-20">
          <img class="w-full" src="assets/img/news/img1.jpg" alt="" title="">
        </div>
        <div class="col-span-2 flex flex-col justify-between -ms-10 me-10">
          <div>
            <h3 routerLink="/news/{{ news.id }}" class="font-bold text-4xl">{{ news.title }}</h3>
            <h4>{{ news.content }}</h4>
          </div>
          <button routerLink="/news/{{ news.id }}" class="btn bg-cyan-100 self-start">{{ 'news.view_more' | translate }}</button>
        </div>
      </div>
      }
    </div>
  </div>
</div>
