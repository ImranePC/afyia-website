<div class="container mt-40 mb-80">
  <div class="bg-white rounded-xl shadow-sm p-5 w-1/3 mx-auto">
    <div class="text-xl font-bold mb-3 border-b pb-3">{{ 'login.title' | translate }}</div>
    <div class="input-group">
      <div>
        <label for="login">{{ 'login.id' | translate }}</label>
        <input type="text" name="login" [(ngModel)]="loginData.id" (change)="isError = false">
      </div>
      <div class="mt-3">
        <label for="password">{{ 'login.password' | translate }}</label>
        <input type="password" name="password" [(ngModel)]="loginData.password" (change)="isError = false">
      </div>
      <span *ngIf="isError" class="text-sm text-red-600 mt-2">{{ 'login.error' | translate }}</span>
      <button class="btn bg-cyan-50 mt-5 w-full" (click)="login()">{{ 'login.connection' | translate }}</button>
    </div>
  </div>
</div>
