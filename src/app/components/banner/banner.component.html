<div
  appParallax
  id="banner"
  class="banner"
  [class.banner--small]="isSmall()"
  [class.banner--dark]="dark"
  [ratio]="-0.3"
  style="background-image: url('{{ imageUrl }}')"
>
  <div [class]="{'opacity-0': isSmall(), 'opacity-100': !isSmall()}">
    <h1 class="reveal">{{ title }}</h1>
  </div>
</div>
