<div>
  <h2 class="text-3xl font-bold mb-6">Voir aussi</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
    @for (n of [1, 2, 3, 4, 5]; track n) {
      <div
        class="group relative aspect-[3/4] rounded-2xl overflow-hidden bg-cover bg-center cursor-pointer"
        style="background-image: url('https://picsum.photos/seed/carousel-{{ n }}/600/800')"
      >
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 p-4">
          <h3 class="text-white font-semibold text-base mb-1">Titre {{ n }}</h3>
          <p class="text-white/70 text-xs mb-3 line-clamp-2">Courte description de l'élément présenté dans cette case.</p>
          <button class="text-white text-xs uppercase tracking-wide border border-white/40 rounded-full px-4 py-1.5 transition hover:bg-white hover:text-black">
            Voir plus
          </button>
        </div>
      </div>
    }
  </div>
</div>
