<div class="bg-white rounded-xl p-5 overflow-clip">
  <div class="flex justify-between">
    <h2 class="text-3xl font-bold mb-6">{{ 'sections.carousel.see_also' | translate }}</h2>
    <div>
      <button (click)="previous()" [disabled]="translateX() >= 0" class="btn btn-dark disabled:opacity-30 disabled:cursor-not-allowed me-3">
        <fa-icon [icon]="faChevronLeft"></fa-icon>
      </button>
      <button (click)="next()" [disabled]="translateX() <= -maxScroll()" class="btn btn-dark disabled:opacity-30 disabled:cursor-not-allowed">
        <fa-icon [icon]="faChevronRight"></fa-icon>
      </button>
    </div>
  </div>
  <div
    #viewport
    class="relative overflow-clip touch-pan-y select-none"
    [class.cursor-grab]="!isDragging()"
    [class.cursor-grabbing]="isDragging()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (click)="onTrackClick($event)"
  >
    <div
      class="pointer-events-none absolute inset-y-0 left-0 z-10 w-16 bg-gradient-to-r from-white to-transparent transition-opacity duration-300"
      [class.opacity-0]="translateX() >= 0"
    ></div>
    <div
      class="pointer-events-none absolute inset-y-0 right-0 z-10 w-16 bg-gradient-to-l from-white to-transparent transition-opacity duration-300"
      [class.opacity-0]="translateX() <= -maxScroll()"
    ></div>
    <div
      #track
      class="flex flex-nowrap gap-4 ease-out"
      [class.transition-transform]="!isDragging()"
      [class.duration-300]="!isDragging()"
      [style.transform]="'translateX(' + translateX() + 'px)'"
    >
      @for (item of items; track item) {
        <div
          class="group relative w-[500px] shrink-0 aspect-[3/2] rounded-2xl overflow-clip bg-cover bg-center cursor-pointer"
          [style.background-image]="'url(' + item.image + ')'"
        >
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
          <div class="absolute inset-x-0 bottom-0 p-4">
            <h3 class="text-white text-2xl font-extrabold mb-1">{{ item.title | translate }}</h3>
            <button class="btn btn-dark" [routerLink]="['/', translate.currentLang, item.route]">{{ 'sections.product.view_more' | translate }}</button>
          </div>
        </div>
      }
    </div>
  </div>
</div>
