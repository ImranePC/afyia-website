<div class="banner" appParallax [ratio]="-0.3" style="background-image: url('../../assets/img/banner/banner_software.png')">
  <h1 class="reveal">{{ 'software.title' | translate }}</h1>
</div>
<div class="container">
  <div class="mx-auto lg:w-8/12 mt-10 mb-10 lg:mb-20">
    <app-ariane [path]="navigationPath"></app-ariane>
  </div>
  <div class="mx-auto lg:w-8/12 bg-white shadow-sm rounded-xl mb-10 p-5 lg:p-10 lg:pt-0">
    <h2 class="text-4xl lg:text-6xl -translate-y-8" [innerHTML]="'software.subtitle' | translate"></h2>
    <div class="grid grid-cols-2">
      <div>
        <p class="mb-5" [innerHTML]="'software.disoft_description' | translate"></p>
      </div>
      <div class="reveal image-container translate-x-20">
        <img src="assets/img/team/img_sarah_faustine.jpg" alt="Photo utilisateur disoft logiciel" title="Photo utilisateur disoft logiciel">
      </div>
    </div>
  </div>

  <div class="mx-auto lg:w-8/12 bg-white shadow-sm rounded-xl p-5 lg:p-10">
    <h2 class="text-4xl lg:text-6xl mb-5" [innerHTML]="'software.access_disoft' | translate"></h2>
    <p class="mb-5">
      {{ 'software.access.description' | translate }}
    </p>
    <div class="text-center">
      <button class="align-middle btn btn-lg" (click)="contactModal.open()">
        {{ 'software.access.request' | translate }}
        <fa-icon class="ms-1" [icon]="faComputer"></fa-icon>
      </button>
    </div>
  </div>
</div>

<app-modal #accessModal>
  <div title>
    {{ 'contact.modal.title' | translate }} <img class="inline align-baseline" width="24px" src="assets/img/emoji_hands_up.png" alt="Wave hand">
  </div>
  <div body>
    {{ 'contact.modal.valid' | translate }}
  </div>
</app-modal>
<app-modal #contactModal size="lg">
  <div title>
    Demande d'accès
  </div>
  <div body>
    <p class="text-small text-base mb-3">Pour demander votre accès au  logiciel DISoft merci de remplir les informations ci-dessous.</p>
    <form [formGroup]="contactForm">
      <div class="flex flex-col gap-5">
        <div class="grid grid-cols-2 gap-5">
          <div class="input-group" [class.is-invalid]="isFieldInvalid('lastname')">
            <label for="lastname">{{ 'contact.sections.form.inputs.name' | translate }}</label>
            <input id="lastname" formControlName="lastname" type="text" maxlength="50">
          </div>
          <div class="input-group" [class.is-invalid]="isFieldInvalid('firstname')">
            <label for="firstname">{{ 'contact.sections.form.inputs.firstname' | translate }}</label>
            <input id="firstname" formControlName="firstname" type="text" maxlength="50">
          </div>
        </div>
        <div class="input-group" [class.is-invalid]="isFieldInvalid('email')">
          <label for="email">{{ 'contact.sections.form.inputs.email' | translate }}</label>
          <input id="email" formControlName="email" type="text" maxlength="50">
        </div>
        <div class="input-group" [class.is-invalid]="isFieldInvalid('purchaseNumber')">
          <label for="purchase_number">Référence d'achat</label>
          <input id="purchase_number" formControlName="purchaseNumber" type="text" maxlength="50">
        </div>
      </div>
    </form>
  </div>
  <div footer>
    <button class="self-start btn btn-lg bg-cyan-700 text-white" [class.disabled]="!contactForm.valid" (click)="onSubmit()">
      <fa-icon class="me-1" [icon]="faPaperPlane"></fa-icon>
      {{ 'contact.sections.form.inputs.button' | translate }}
    </button>
  </div>
</app-modal>
