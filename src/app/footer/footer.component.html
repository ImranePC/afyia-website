<div class="
  footer-container mt-20 px-10 py-16 text-white flex flex-col font-light justify-center text-center gap-10
  lg:flex-row lg:gap-20 lg:text-start
">
  <div class="font-extrabold self-center">
    <img src="assets/img/afyia_logo_white.svg" width="80px" alt="Logo AFYIA footer">
  </div>
  <div class="hidden lg:block my-3 w-[1px] border-s border-slate-400"></div>
  <div class="text-white">
    <div class="font-bold text-lg">{{ 'footer.contact.title' | translate }}</div>
    <a routerLink="/contact">Contact</a>
    <a href="https://linkedin.com/company/afyia-diagnostics" target="_blank">
      Linkedin <fa-icon class="ms-1" [icon]="faUpRightFromSquare" size="xs"></fa-icon>
    </a>
    <a href="mailto:contact@afyia-diagnostics.com">contact&#64;afyia-diagnostics.com</a>
  </div>
  <div>
    <div class="font-bold text-lg">{{ 'footer.legal.title' | translate }}</div>
    <a routerLink="/legal-mentions">{{ 'footer.legal.notice' | translate }}</a>
  </div>
  <div class="opacity-50">
    <div class="font-bold text-lg">{{ 'footer.company.title' | translate }}</div>
    <div>{{ 'footer.company.about' | translate }}</div>
  </div>
</div>
