@if (description.length <= 0) {
<div
  class="min-h-[350px] h-full p-5 rounded-2xl text-center flex flex-col-reverse relative background-image"
  style="background-image: url('../../../assets/img/{{ imagePath }}')"
>
  <div class="z-10 w-[80%] text-white absolute top-[40%] left-[50%] -translate-x-1/2 text-center text-shadow">
    <span class="font-extrabold text-4xl">{{ title }}</span> <br><span class="font-bold text-3xl"> {{ subTitle }}</span>
  </div>
  <!-- <div class="btn btn-white w-fit mx-auto z-10">
    {{ 'sections.product.view_more' | translate }}
  </div> -->
</div>
} @else {
<div
  class="min-h-[250px] h-full p-5 rounded-2xl text-left flex flex-col justify-between relative background-image background-image-darken"
  [class.disabled]="disabled"
  style="background-image: url('../../../assets/img/{{ imagePath }}')"
>
  <div class="z-10 text-white text-shadow">
    <span class="font-extrabold text-4xl">{{ title }}</span> <br>
    <span class="block mb-2 text-2xl"> {{ subTitle }}</span>
    @if (!disabled) {
      <span>{{ description }}</span>
    }
  </div>
  <div class="flex justify-between items-center mt-5">
    <div class="z-10">
    @if (ce) {
      <img src="assets/img/ce.svg" width="30px" alt="CE Logo SVG">
    } @else if (ruo) {
      <b class="block border px-1 border-white text-white">RUO</b>
    }
    </div>
    @if (!disabled) {
    <div class="btn btn-white z-10">
      {{ 'sections.product.view_more' | translate }} @if (link) { <fa-icon class="ms-1" [icon]="faUpRightFromSquare" size="sm"></fa-icon> }
    </div>
    } @else {
      <div class="btn bg-black bg-opacity-75 text-white z-10">
        {{ description }}
      </div>
    }
  </div>
</div>
}
