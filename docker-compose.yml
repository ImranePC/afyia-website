version: '3.8'

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afyia-website
    ports:
      - "4200:80"
    volumes:
      - ./dist/afyia-website/browser:/usr/share/nginx/html

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    container_name: afyia-api
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - ./directus/database/afyiadb.sqlite:/app/afyiadb.sqlite
      - /etc/ssl/letsencrypt/certs:/etc/ssl/letsencrypt/certs
    env_file:
      - ./api/.env
    environment:
      - NODE_ENV=development

  directus:
    image: directus/directus:11.5.1
    container_name: afyia-directus
    ports:
      - 8055:8055
    volumes:
      - ./directus/database:/directus/database
      - ./api/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    environment:
      SECRET: "secret"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/afyiadb.sqlite"
      WEBSOCKETS_ENABLED: "true"
